services:
  - type: web
    name: insitu-tutor-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python scripts/preseed_demo.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_PATH
        value: tutor.db
